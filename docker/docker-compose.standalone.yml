version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../apps/backend
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ../apps/backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DEPLOYMENT_MODE=STANDALONE
      - LICENSE_KEY=POS-STANDALONE-KEY
      - DATABASE_URL=postgres://pos:pos@db:5432/retail_pos
    depends_on:
      - db
      - redis

  web:
    build: ../apps/web
    volumes:
      - ../apps/web:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
